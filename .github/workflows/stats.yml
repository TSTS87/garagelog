# Weekly snapshot of downloads and repository traffic (ADR-017).
# Runs tools/collect-stats.py and commits the CSV files to the separate "stats" branch,
# so main keeps a history of real development only. Can also be started by hand
# (Actions → Stats → Run workflow).
name: Stats

on:
  schedule:
    - cron: '17 4 * * 1'  # Mondays 04:17 UTC; GitHub keeps traffic for 14 days, so weekly leaves margin
  workflow_dispatch:

permissions:
  contents: write  # push to the stats branch

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: stats
          path: stats-data
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Traffic needs a fine-grained token with "Administration: read"; without the secret
          # only downloads and repository counters are collected.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 tools/collect-stats.py stats-data
      - name: Commit
        working-directory: stats-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m "stats: snapshot $(date -u +%F)"
          git push
