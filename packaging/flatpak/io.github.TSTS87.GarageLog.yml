# Flatpak manifest for local development builds (builds the working tree).
# The Flathub manifest in packaging/flathub/ builds a git tag instead.
id: io.github.TSTS87.GarageLog
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: garagelog
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Garages may live in ~/Documents; the document portal would only expose the
  # single .sqlite file, not the attachments/ folder next to it (ADR-014).
  - --filesystem=xdg-documents
  # No --share=network: GarageLog works offline (SPEC §3).
modules:
  - name: garagelog
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ../..
        # Local build trees must not be copied into the Flatpak build.
        skip:
          - build
          - build-flatpak
          - .flatpak-builder
